{% if not table.has_any_rows and can_upload %}<div id="{{ table.table_id }}" role="alert" class="alert alert-soft alert-info"><span>{{ empty_text }}</span><a class="btn btn-sm btn-primary" href="{% url 'findata:upload' dataset.id %}{% if as_of %}?as_of={{ as_of|date:'Y-m-d' }}{% endif %}" title="Upload a file or read from a database into {{ dataset.name }}">Upload</a></div>{% else %}{% include "django_datatable/list_table.html" with row_template="findata/partials/data_row.html" actions_heading=True %}{% endif %}
