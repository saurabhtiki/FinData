[project]
name = "findata"
version = "0.1.0"
description = "Reusable Django add-on: define and keep a per-company financial database in PostgreSQL."
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<5.3",
    "psycopg[binary]>=3.2",
    "django-datatable",
    "data-core[postgres]",
    "openpyxl>=3.1.5",
]

[project.optional-dependencies]
mysql = ["pymysql>=1.1"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "ruff>=0.8",
    "python-dotenv>=1.0",
    "waitress>=3.0",
    "whitenoise>=6.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["findata"]

[tool.uv.sources]
django-datatable = { git = "https://github.com/saurabhtiki/django-datatable" }
data-core = { git = "https://github.com/saurabhtiki/data-core" }

[tool.pytest.ini_options]
testpaths = ["tests"]
DJANGO_SETTINGS_MODULE = "demo.settings.pytest"
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
extend-exclude = ["findata/migrations"]

[tool.ruff.lint]
extend-ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
"demo/settings/*.py" = ["F403", "F405"]
